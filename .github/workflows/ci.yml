name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Syntax check and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26.x
      # No npm ci: check and test import only node: builtins, so the install
      # would just pull Playwright and serve for nothing.
      - run: npm run check
      - run: npm test

  edge:
    name: Edge function tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          # Pinned, not v2.x: a floating version turns PRs red for reasons that
          # have nothing to do with the change. Keep this in step with the deno
          # version in package.json's test:edge, and upgrade both in one
          # deliberate commit.
          deno-version: v2.9.6
      # Same suite and flags as npm run test:edge, without the npx deno-bin
      # download. --node-modules-dir=none is required because this repo has a
      # package.json (Playwright, serve) but the edge functions are Supabase
      # Deno functions: their npm: imports belong in Deno's own cache, not in
      # the npm-managed node_modules.
      - run: deno test --no-lock --node-modules-dir=none -A tests/edge/
